# Release: push a tag like v0.1.0 and four double-click zips appear on the
# Releases page. Every zip carries the official Node 22 runtime for its OS and
# a prebuilt Next.js server, so the person downloading installs nothing.
#
# package (Linux, builds all four) → smoke (each on its own native runner)
# → release (the only job that may write to the repo).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build once
        run: npm run build
      - name: Package the four zips
        run: |
          for target in windows-x64 macos-arm64 macos-x64 linux-x64; do
            scripts/package-release.sh "$target" --out dist --no-build
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ matrix.target }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-latest } # Apple silicon
          # macos-15-intel is the only Intel macOS runner left (macos-13 was
          # retired in December 2025) and GitHub drops x86_64 macOS after the
          # macOS 15 image goes, in autumn 2027.
          - { target: macos-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-latest }
    steps:
      # The smoke harness comes from the repo; everything it drives comes from
      # the zip, including the Node that runs the harness itself.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: dist
      - name: Unzip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*-${{ matrix.target }}.zip)[0].FullName
          Expand-Archive -Path $zip -DestinationPath extracted -Force
      - name: Unzip (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p extracted
          unzip -q "dist/"*-${{ matrix.target }}.zip -d extracted
          test -x "extracted/JollyOS/Start JollyOS.command" || test -x extracted/JollyOS/start-jollyos.sh
      - name: Start it, check the setup page, stop it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\extracted\JollyOS\runtime\node.exe scripts\smoke-release.mjs .\extracted\JollyOS
      - name: Start it, check the setup page, stop it (macOS, Linux)
        if: runner.os != 'Windows'
        run: ./extracted/JollyOS/runtime/bin/node scripts/smoke-release.mjs ./extracted/JollyOS

  release:
    name: Publish the release
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that needs it: it creates the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download JollyOS

          Nothing to install. Download the file for your computer, unzip it, and
          double-click the launcher inside.

          | Your computer | File |
          |---|---|
          | Windows | `windows-x64` |
          | Mac with Apple silicon (M1 and newer) | `macos-arm64` |
          | Mac with an Intel chip | `macos-x64` |
          | Linux (x86-64) | `linux-x64` |

          On a Mac, click the Apple menu > About This Mac: "Chip: Apple M…" means
          Apple silicon, "Processor: Intel" means Intel.

          Then: unzip, double-click **Start JollyOS**, and pick a username and
          password on the page that opens.

          - **Windows** shows "Windows protected your PC": More info > Run anyway.
          - **macOS** says it cannot verify the developer: right-click Start
            JollyOS > Open. On macOS 15 and newer you may also need System
            Settings > Privacy & Security > Open Anyway.
          - **Linux**: `chmod +x start-jollyos.sh` if your unzip tool dropped the
            permission bit.

          Each zip contains the official Node.js 22 runtime for that system
          (checksum-verified at build time) and a prebuilt production server.
          JollyOS listens on 127.0.0.1 only. Your data stays in the `data` folder
          next to the app.
          NOTES
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --title "JollyOS $TAG" \
            --notes-file notes.md \
            --latest
